# Builds the debug APK on every push and pull request, and uploads it as an artifact.
#
# Why this exists: the wake-word engine (voice/LiveKitWakeWordDetector.kt) was written in an
# environment with no JDK, no Android SDK and no network access to Maven or Google, so it was never
# compiled. This workflow is the first place that code is actually compiled. Treat a red run here
# as real: it means the app does not build.
#
# Cost note: the Android SDK + Gradle dependency cache makes the first run slow; the cache below
# keeps subsequent runs to a few minutes.
name: Android build

on:
  # Any branch, not just main: this workflow is the project's compile check, and it is most
  # useful on the branch you are actually working on, before it is merged.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One build per branch. Cancel superseded runs so a push does not queue behind a stale one.
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: assembleDebug (API 36, JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # JDK 17 exactly: docs/getting-started/build-and-run.md notes newer JDKs break the
      # Kotlin/AGP toolchain here.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No `setup-android` action. GitHub's ubuntu image already ships the Android SDK
      # (cmdline-tools 12, build-tools 36.0.0, platform-tools) and exports ANDROID_HOME, and the
      # third-party action was failing here on a Node 20/24 mismatch. Only the platform itself is
      # installed below, by idempotent sdkmanager calls.
      - name: Show the preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          du -sh "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('aura-android/**/*.gradle.kts', 'aura-android/gradle/libs.versions.toml', 'aura-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Idempotent: installs only what the image lacks. Licences are already accepted on the
      # hosted image, so a failure here is a real problem and must not be swallowed.
      - name: Ensure platform 36 is installed
        run: |
          set -x
          sdkmanager --version
          sdkmanager --list_installed | head -40
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # local.properties is git-ignored; the build needs sdk.dir.
      - name: Point Gradle at the SDK
        working-directory: aura-android
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      # The LiveKit model is deliberately not committed (see docs/decisions/livekit-wakeword.md).
      # --allow-missing keeps this job from failing when GitHub's release CDN is unavailable, but
      # the APK then silently falls back to sherpa-onnx, so the step above warns loudly.
      - name: Fetch the LiveKit wake word model (optional)
        working-directory: aura-android
        run: ./scripts/fetch-wakeword-model.sh --allow-missing

      # The debug build copies google-services.example.json into place itself, so no Firebase
      # project is needed. See docs/getting-started/build-and-run.md.
      - name: Assemble debug APK
        working-directory: aura-android
        run: ./gradlew :app:assembleDebug --stacktrace

      # A successful build does NOT prove the wake-word model is bundled: the app falls back to
      # sherpa-onnx rather than failing. Assert it here instead of trusting the green tick.
      - name: Assert the wake word model is in the APK
        working-directory: aura-android
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          if unzip -l "$APK" | grep -q 'assets/wakeword/.*\.onnx'; then
            echo "OK: LiveKit wake word model is bundled — this APK uses the LiveKit engine."
            unzip -l "$APK" | grep 'assets/wakeword/'
          else
            echo "::warning::No LiveKit model in the APK. It will run the sherpa-onnx fallback."
            echo "### Wake word: fallback engine" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`assets/wakeword/*.onnx\` in this APK, so it runs sherpa-onnx. Fetch the model to use the LiveKit engine." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: aura-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Unit tests do not need a device. Kept after the APK so a test failure does not hide
      # whether the app itself builds.
      - name: Unit tests
        working-directory: aura-android
        run: ./gradlew :app:testDebugUnitTest :mcp-server:test
